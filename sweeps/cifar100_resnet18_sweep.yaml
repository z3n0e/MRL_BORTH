program: main.py
name: cifar100-resnet18-mrl
method: grid
metric:
  name: eval/top1/dim_512
  goal: maximize
parameters:
  data-root:
    value: auto
  output-root:
    value: ./cifar100_sweep_runs
  feature-dim:
    value: 512
  prefix-dims:
    value: 8,16,32,64,128,256,512
  epochs:
    value: 90
  train-batch-size:
    value: 128
  val-batch-size:
    value: 128
  seed:
    values: [56, 123, 999, 876, 456]
  lr:
    value: 0.1
  warmup-epochs:
    value: 5
  min-lr:
    value: 0.00001
  weight-decay:
    value: 0.0005
  label-smoothing:
    values: [0.0, 0.1]
  prefix-mask-prob:
    values: [0.0, 0.25, 0.5, 0.75, 0.85]
  prefix-mask-scale:
    value: none
  mrl-loss-mode:
    values: [all]
  sampled-prefix-distribution:
    values: [uniform, inverse_sqrt_dim]
  sampled-prefix-log-interval:
    value: 100
  eval-workers:
    value: 4
  nc-enabled:
    value: 1
  nc-interval:
    value: 10
  nc-splits:
    value: train,test
  nc-workers:
    value: 4
  nc-batch-size:
    value: 128
  index-type:
    value: exactl2
  neighbor-k:
    value: 2048
  shortlist:
    value: 1,5,10,25,50,100
  use-gpu:
    value: 1
  rebuild-index:
    value: 0
  force-arrays:
    value: 0
  wandb-enabled:
    value: 1
  wandb-project:
    value: mrl-borth
  wandb-group:
    value: cifar100-resnet18-mrl-sweep
  wandb-tags:
    value: cifar100,resnet18,mrl,sweep,main-cli
command:
  - ${env}
  - ${interpreter}
  - ${program}
  - full
  - ${args}
