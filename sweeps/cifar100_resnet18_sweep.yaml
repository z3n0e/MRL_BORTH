program: scripts/run_cifar100_sweep.py
name: cifar100-resnet18-mrl
method: bayes
metric:
  name: eval/top1/dim_512
  goal: maximize
parameters:
  data.root:
    value: /home/bagnoli/.cache/torchvision
  output_root:
    value: ./cifar100_sweep_runs
  model.mrl:
    value: 1
  training.epochs:
    value: 100
  training.batch_size:
    value: 128
  validation.batch_size:
    value: 128
  training.seed:
    values: [56, 123, 999, 876, 456]
  lr.lr:
    value: 0.1
  lr.warmup_epochs:
    value: 5
  lr.min_lr:
    value: 0.00001
  training.weight_decay:
    value: 0.0005
  training.label_smoothing:
    values: [0.0, 0.1]
  model.prefix_mask_prob:
    values: [0.0, 0.25, 0.5, 0.75, 0.85]
  training.mrl_loss_mode:
    values: [all]
  training.sampled_prefix_distribution:
    values: [uniform, inverse_sqrt_dim]
  wandb.enabled:
    value: 1
  wandb.project:
    value: mrl-borth
  wandb.group:
    value: cifar100-resnet18-mrl-sweep
  wandb.tags:
    value: cifar100,resnet18,mrl,sweep
command:
  - ${env}
  - ${interpreter}
  - ${program}
  - ${args}
